<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5ef" />
    <meta
      name="description"
      content="A soft little space to play. Stretch, squish, and toss colorful jelly in an interactive physics playground."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Little Worlds — A soft little space to play</title>
    <link rel="stylesheet" href="/src/loading.css" />
  </head>
  <body>
    <div id="level-loading" role="status" aria-live="polite" aria-atomic="true">
      <div class="loading-card">
        <p class="loading-brand">little worlds</p>
        <div class="loading-orbit" aria-hidden="true"></div>
        <h1 id="loading-title">Loading your little world…</h1>
        <p id="loading-detail">A little moment. A new world to explore.</p>
        <button id="loading-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <div id="app" inert aria-busy="true"></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
